# 可选的一键更新扩展。它需要访问 Docker Socket，等同较高宿主机权限，请仅在可信服务器启用。
services:
  panel:
    environment:
      # 仅容器内部访问更新侧车，不向宿主机或公网暴露 8080 端口。
      UPDATE_TRIGGER_URL: http://updater:8080/v1/update
      # Token 同时注入面板与更新侧车；必须使用随机强值且不得提交到 Git。
      UPDATE_TRIGGER_TOKEN: ${UPDATE_TRIGGER_TOKEN:?启用自动更新时必须在 .env 设置 UPDATE_TRIGGER_TOKEN}
    depends_on:
      updater:
        condition: service_started

  updater:
    # 固定版本避免更新基础设施自身被 latest 意外改变；升级此版本前应先看上游发行说明。
    image: containrrr/watchtower:1.7.1
    container_name: go-panel-updater
    restart: unless-stopped
    environment:
      # 只允许携带 Bearer Token 的 HTTP 请求触发检查，不做无人值守的周期更新。
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "false"
      WATCHTOWER_HTTP_API_TOKEN: ${UPDATE_TRIGGER_TOKEN:?启用自动更新时必须设置随机 Token}
      # enable + scope 双重标签把更新范围限制为本项目面板容器。
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: go-panel
      # 成功替换后清理旧镜像，避免长期占用磁盘；数据库卷不会被清理。
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      # Docker Socket 可控制宿主机容器，任何能修改此服务的人都应视为拥有宿主机管理权限。
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      # 更新侧车不更新自身，防止递归替换。
      com.centurylinklabs.watchtower.enable: "false"
