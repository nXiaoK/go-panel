# 默认部署只拉取 GitHub Container Registry 的稳定镜像，不在服务器本地编译源码。
name: go-panel

services:
  panel:
    # GO_PANEL_VERSION 默认跟随 latest；生产环境也可固定为 v0.1.0 等明确版本便于回滚。
    image: ghcr.io/nxiaok/go-panel:${GO_PANEL_VERSION:-latest}
    pull_policy: always
    container_name: go-panel
    restart: unless-stopped
    stop_grace_period: 30s
    # VITE_DEV_API_TARGET 只由源码目录的 Vite 开发服务器读取，不传入生产容器；
    # 镜像内静态 SPA 与 Go 后端同源访问，不能用该变量更换生产 API 地址。
    environment:
      # 容器必须监听全部接口；宿主机暴露范围由下方 ports 和防火墙控制。
      LISTEN_ADDR: ":6365"
      # 远程部署必须使用至少 32 字节随机密钥；修改后所有现有登录令牌立即失效。
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 中设置至少 32 字节的 JWT_SECRET}
      # 新令牌默认 2160h（90天），范围 1h–2160h（Go duration）；越界或无效值拒绝启动。
      # 缩短会增加登录频率，已签发令牌仍按原 exp 到期；立即全部失效需轮换 JWT_SECRET。
      # 轮换 JWT_SECRET 同时影响 R2 凭据解密，需重新配置凭据，不能仅为缩短会话而随意轮换。
      JWT_TTL: ${JWT_TTL:-2160h}
      # 首次创建管理员时使用；已有安全管理员后可清空，避免长期保存明文密码。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin_user}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 生产模式拒绝 CORS 通配符；必须填写实际访问面板的 http(s) 来源。
      ENVIRONMENT: production
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?必须在 .env 中设置面板访问来源}
      # HTML CSP 首版默认 report-only 仅报告，观察一个版本后显式设 enforce 才拦截违规资源。
      # off 会失去 CSP 纵深防护；非法值拒绝启动，API/订阅/静态资源不发送 CSP。
      # 违规报告写入容器日志“CSP 违规报告”；观察期内确认无违规后再显式设 enforce。
      CSP_MODE: ${CSP_MODE:-report-only}
      # 仅填写真正终止 TLS/反向代理请求的 CIDR；空值时不信任任何转发头。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 明文 HTTP 节点下载可能泄露节点密钥并被篡改，只应在受控升级窗口临时开启。
      ALLOW_INSECURE_NODE_DOWNLOADS: ${ALLOW_INSECURE_NODE_DOWNLOADS:-false}
      # 旧 nft 上报缺少幂等保障，仅在升级旧节点的短暂兼容窗口开启。
      ALLOW_LEGACY_NFT_REPORTS: ${ALLOW_LEGACY_NFT_REPORTS:-false}
      # 默认每 6 小时检查一次稳定 Release；失败不会影响面板正常运行。
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-true}
      UPDATE_REPOSITORY: ${UPDATE_REPOSITORY:-nXiaoK/go-panel}
      UPDATE_CHECK_INTERVAL: ${UPDATE_CHECK_INTERVAL:-6h}
      # 固定版本标签不会跨 Release 移动：后端据此判断更新侧车是否可用，并在软更新时提示运行版本将高于镜像标签。
      UPDATE_IMAGE_TAG: ${GO_PANEL_VERSION:-latest}
      # 一键更新方式：auto（默认）优先软更新——在数据卷中切换经签名校验的新版本，无需 Docker Socket，失败自动回滚；
      # 不可用时依次退回 compose.update.yml 的更新侧车与手动命令。soft、sidecar 只用对应方式，manual 关闭一键更新。
      # 非法值拒绝启动。软更新只替换面板与节点程序，不更新基础镜像，也不修改 Compose 或环境变量。
      UPDATE_STRATEGY: ${UPDATE_STRATEGY:-auto}
      # 应急开关：true 时忽略数据卷中的软更新版本与待处理的切换请求，直接运行镜像内置版本，不删除任何文件。
      # 只用于软更新版本反复崩溃等紧急情况；排除问题后改回 false，或在面板中“恢复镜像内置版本”持久切换。
      PANEL_USE_BUILTIN: ${PANEL_USE_BUILTIN:-false}
      # 数据库、更新前备份与软更新版本（runtime/）都位于此持久卷，重建容器不会丢失。
      # 保留历史文件名以兼容旧数据卷；重命名会让升级后的面板误以为数据库为空。
      DB_PATH: /app/data/flux-panel.db
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 若前面有反向代理，可改为 127.0.0.1:6365:6365，避免面板端口直接暴露公网。
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_PORT:-6365}:6365"
    volumes:
      - panel_data:/app/data
    labels:
      # 只有显式启用 compose.update.yml 时，受限更新侧车才处理此容器。
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "go-panel"

volumes:
  # 删除此卷会永久删除 SQLite 数据库、本地更新备份与软更新下载的版本，升级时不得执行 docker compose down -v。
  # 拉取新镜像后，版本不高于镜像的软更新版本会自动停用，以镜像为准。
  panel_data:
