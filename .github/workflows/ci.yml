name: ci-and-release

on:
  # 所有分支 Push 都执行测试和镜像构建；只有 main 与 v* 标签会推送公开产物。
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

# 默认只读；推送镜像和创建 Release 的权限在对应 Job 内最小化开启。
permissions:
  contents: read

# 同一分支只保留最新构建，避免快速连续 Push 浪费 Actions 配额；正式标签不互相取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-frontend
    steps:
      # checkout v5 使用 Node.js 24；回退 v4 会恢复 Node.js 20 弃用警告。
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # 与 Dockerfile 保持一致，防止本地和 CI 使用不同 Node 主版本。
          node-version: "22"
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: 上传前端嵌入测试产物
        uses: actions/upload-artifact@v4
        with:
          name: vite-spa-dist
          path: vite-frontend/dist
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      # checkout v5 与 setup-go v6 使用 Node.js 24，避免后端任务依赖已弃用运行时。
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # 固定 1.26.10 修复网络服务和证书校验漏洞；主程序、节点工具和 Docker 必须同步，降级会恢复已知安全风险。
          go-version: "1.26.10"
          cache-dependency-path: |
            go.sum
            go-gost/go.sum
            go-gost/x/go.sum
      - name: 下载前端产物
        # v5 使用 Node.js 24；回退 v4 会恢复 Node.js 20 弃用警告。
        uses: actions/download-artifact@v5
        with:
          name: vite-spa-dist
          path: vite-frontend/dist
      - name: 同步内嵌前端
        run: bash ./scripts/sync-web-dist.sh
      - name: 后端测试、静态检查与节点工具编译
        run: |
          set -euo pipefail
          if ! go test ./... -count=1; then
            echo "::error::go test 失败，重新输出 service 包详细日志"
            go test ./internal/service -count=1 -v || true
            exit 1
          fi
          go vet ./...
          go build ./...
          go build ./cmd/node-assets/nft_agent
          go build ./cmd/node-assets/nft_rule_payload
          go build ./cmd/node-assets/nft_flow_reporter
      - name: 关键并发路径 Race 检查
        run: go test -race -count=1 ./internal/ws ./internal/task ./internal/service ./internal/selfupdate/... ./cmd/node-assets/nft_agent ./cmd/node-assets/nft_flow_reporter ./internal/nftgeneration
      - name: 隔离软更新测试构建标签
        run: |
          set -euo pipefail
          # selfupdate_e2e 标签会信任环境变量提供的测试公钥，只能用于本地容器端到端测试；
          # 这里保证其代码仍可编译，同时禁止正式构建（镜像与 Release）启用它。
          go vet -tags selfupdate_e2e ./internal/selfupdate/...
          if grep -n "selfupdate_e2e" Dockerfile scripts/build-release.sh scripts/build-node-assets.sh; then
            echo "::error::正式构建不得使用 selfupdate_e2e 构建标签"
            exit 1
          fi
      - name: 测试内置 go-gost 模块
        run: |
          set -euo pipefail
          cd go-gost
          go test ./... -count=1
          go vet ./...
          go build ./...
          cd x
          # x 是独立模块；必须全量验证，覆盖内置节点的所有协议和传输实现。
          go test ./... -count=1
          go vet ./...
          go build ./...
      - name: 扫描三个 Go 模块的可达漏洞
        run: |
          set -euo pipefail
          # 固定扫描器版本确保 CI 可复现；升级版本前需先确认新的检测规则不会误报。
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
          (cd go-gost && govulncheck ./...)
          (cd go-gost/x && govulncheck ./...)

  # 仅预警最新稳定 Go 的标准库兼容变化；聚焦直接解析系统输出的节点工具，不替代固定版本的后端门槛。
  node-go-forward-compatibility:
    name: 节点工具 Go 前瞻兼容预警
    runs-on: ubuntu-latest
    # 仅此新增作业允许失败，不阻断镜像或发布；现有 backend 检查仍必须通过。
    continue-on-error: true
    steps:
      # checkout v5 与 setup-go v6 使用 Node.js 24，避免新增预警作业使用已弃用运行时。
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # 每次选择最新稳定版（不含预发布版），提前发现 encoding/json 等行为变化；正式发布版本仍固定。
          go-version: stable
          check-latest: true
          # 缓存仅服务本作业的主模块依赖，不改变固定工具链作业的依赖与安全门槛。
          cache-dependency-path: go.sum
      - name: 检查节点工具与 nft 生成器兼容性
        run: go test ./cmd/node-assets/... ./internal/nftgeneration -count=1

  # 标签发布的签名产物：先于镜像与 Release 完成。签名私钥缺失、与内置公钥不匹配、
  # 或清单与实际二进制不一致时整个发布在此失败，镜像不会推送，Release 也不会创建。
  release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # 私钥只保存在受保护的 release 环境中：应限定 v*.*.* 标签并要求维护者审批，配置方法见 RELEASING.md。
    environment: release
    permissions:
      contents: read
    steps:
      # checkout v5 使用 Node.js 24；回退 v4 会恢复 Node.js 20 弃用警告。
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json
      # setup-go v6 使用 Node.js 24；Go 安全补丁版本由下方显式固定。
      - uses: actions/setup-go@v6
        with:
          # Release 必须使用与测试、Docker 相同的安全补丁版本，避免发布产物重新引入已知漏洞。
          go-version: "1.26.10"
          cache-dependency-path: |
            go.sum
            go-gost/go.sum
            go-gost/x/go.sum
      - name: 构建 Release 压缩包、更新清单与校验文件
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix vite-frontend
          npm run build --prefix vite-frontend
          bash ./scripts/sync-web-dist.sh
          bash ./scripts/build-release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: 用发布私钥签名更新清单
        shell: bash
        env:
          # 主私钥必填，缺失时签名失败、整个发布中止。轮换期间可在同一环境另设 _NEXT，两把私钥同时签名。
          GO_PANEL_RELEASE_SIGNING_KEY: ${{ secrets.GO_PANEL_RELEASE_SIGNING_KEY }}
          GO_PANEL_RELEASE_SIGNING_KEY_NEXT: ${{ secrets.GO_PANEL_RELEASE_SIGNING_KEY_NEXT }}
        run: |
          set -euo pipefail
          go run ./tools/releasetool sign \
            --manifest release/update-manifest.json \
            --key-env GO_PANEL_RELEASE_SIGNING_KEY \
            --optional-key-env GO_PANEL_RELEASE_SIGNING_KEY_NEXT \
            --out release/update-manifest.json.sig
      - name: 用内置公钥复验签名、压缩包与逐文件哈希
        shell: bash
        run: |
          set -euo pipefail
          # 复验使用源码中内置的公钥：secret 与公钥不是一对时在此失败，避免发布面板无法验证的版本。
          go run ./tools/releasetool verify \
            --manifest release/update-manifest.json \
            --sig release/update-manifest.json.sig \
            --release-dir release \
            --repository "${GITHUB_REPOSITORY}"
          # 实际执行 amd64 面板程序，确认清单中的版本、commit 与兼容声明来自同一次构建。
          go run ./tools/releasetool selfcheck \
            --manifest release/update-manifest.json \
            --binary "release/go-panel-${GITHUB_REF_NAME}-linux-amd64/go-panel"
      - name: 暂存待发布产物
        # v4 与仓库现有的 upload-artifact 用法保持一致；产物只保留 1 天，供同一工作流的发布作业下载。
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/update-manifest.json
            release/update-manifest.json.sig
          if-no-files-found: error
          retention-days: 1

  image:
    runs-on: ubuntu-latest
    needs: [frontend, backend, release-assets]
    # 分支推送时 release-assets 被跳过，镜像照常构建；标签推送时必须等签名产物成功，
    # 避免先推送 latest 镜像、之后才发现签名失败造成镜像与 Release 不一致。
    if: ${{ !cancelled() && needs.frontend.result == 'success' && needs.backend.result == 'success' && (needs.release-assets.result == 'success' || needs.release-assets.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    steps:
      # checkout v5 使用 Node.js 24；回退 v4 会恢复 Node.js 20 弃用警告。
      - uses: actions/checkout@v5
      - name: 计算构建版本元数据
        id: build
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            version="edge-${short_sha}"
          else
            version="build-${short_sha}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: 启用跨架构模拟
        uses: docker/setup-qemu-action@v3
      - name: 创建 Buildx 构建器
        uses: docker/setup-buildx-action@v3
      - name: 登录 GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签和 OCI 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nxiaok/go-panel
          # metadata-action 默认会剥离 Git 标签开头的 v；显式补回，确保镜像标签与版本号及回滚文档一致。
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/nXiaoK/go-panel
            org.opencontainers.image.revision=${{ github.sha }}
      - name: 构建并按发布通道推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # 普通分支和 PR 也完整构建，但不会获得 packages:write 或污染公开标签。
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 只发布 release-assets 已签名并复验过的产物，不在此重新构建。
    needs: [image, release-assets]
    permissions:
      contents: write
    steps:
      # checkout v5 使用 Node.js 24；gh 需要仓库上下文以校验标签。
      - uses: actions/checkout@v5
      - name: 下载已签名的发布产物
        # v5 使用 Node.js 24；回退 v4 会恢复 Node.js 20 弃用警告。
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: release
      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # 更新清单与签名必须和压缩包一起发布，否则面板无法软更新到此版本。
          assets=(release/*.tar.gz release/SHA256SUMS release/update-manifest.json release/update-manifest.json.sig)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "go-panel ${GITHUB_REF_NAME}"
          fi
