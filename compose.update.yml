# 可选的一键更新扩展。它需要访问 Docker Socket，等同较高宿主机权限，请仅在可信服务器启用。
# 面板默认的“软更新”在数据卷中切换经签名校验的新版本，不需要本扩展；侧车只用于 Release 标注
#“需要更新镜像”的版本（运行环境 RuntimeABI 变化或 supervisor 修复），详见 OPERATIONS.md。
services:
  panel:
    environment:
      # 仅容器内部访问更新侧车，不向宿主机或公网暴露 8080 端口。
      UPDATE_TRIGGER_URL: http://updater:8080/v1/update
      # Token 同时注入面板与更新侧车；必须使用随机强值且不得提交到 Git。
      UPDATE_TRIGGER_TOKEN: ${UPDATE_TRIGGER_TOKEN:?启用自动更新时必须在 .env 设置 UPDATE_TRIGGER_TOKEN}
    depends_on:
      updater:
        condition: service_started

  updater:
    # 原 containrrr/watchtower 已于 2025-12-17 归档并停在 1.7.1：其内置 Docker API 1.25 低于 Docker Engine 29
    # 要求的最低 1.44，会报 “client version 1.25 is too old” 并反复重启，导致一键更新失效。
    # 改用社区维护的 nickfedor/watchtower（非原作者背书，2026-10-24 按 v1.22.3 源码核实）：下方环境变量、
    # 标签以及 POST /v1/update + Bearer Token 鉴权与原版一致，并会自动协商 Docker API 版本。
    # 同时固定版本与多架构 digest，避免更新基础设施自身被意外替换；升级前先阅读其发行说明并重新核对兼容性。
    image: nickfedor/watchtower:1.22.3@sha256:2f8f2a9bd21a195b3b650409532a20f6aada8ef5834f00d0d7a999dee0779a81
    container_name: go-panel-updater
    restart: unless-stopped
    environment:
      # 只允许携带 Bearer Token 的 HTTP 请求触发检查，不做无人值守的周期更新。
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "false"
      WATCHTOWER_HTTP_API_TOKEN: ${UPDATE_TRIGGER_TOKEN:?启用自动更新时必须设置随机 Token}
      # enable + scope 双重标签把更新范围限制为本项目面板容器。
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: go-panel
      # 成功替换后清理旧镜像，避免长期占用磁盘；数据库卷不会被清理。
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      # Docker Socket 可控制宿主机容器，任何能修改此服务的人都应视为拥有宿主机管理权限。
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      # 更新侧车不更新自身，防止递归替换。
      com.centurylinklabs.watchtower.enable: "false"
